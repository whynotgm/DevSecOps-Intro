- rule: Container Write Under Tmp
  desc: Detect a successful writable file open under /tmp in a container.
  condition: open_write and container.id != host and fd.name startswith /tmp/
  output: Container opened tmp file for writing (container=%container.name user=%user.name file=%fd.name command=%proc.cmdline)
  priority: WARNING
  tags: [container, drift]

- rule: Likely Container Mining Connection
  desc: A miner-named process attempts a connection to a common mining pool port.
  condition: >
    evt.type=connect and evt.dir=< and container.id != host
    and fd.sport in (3333, 4444, 5555, 7777, 14444)
    and proc.name in (xmrig, minerd, cpuminer, cryptominer)
  output: Likely mining connection (container=%container.name process=%proc.name command=%proc.cmdline destination=%fd.sip:%fd.sport result=%evt.res)
  priority: CRITICAL
  tags: [container, mitre_command_and_control]
